[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acdyon"
version = "0.1.0"
description = "Resilient, ethical job-listing ingestion pipeline"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "motor>=3.4",
    "pymongo>=4.7",
    "apscheduler>=3.10",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",          # pretty CLI output
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "mongomock-motor>=0.0.21",
    "respx>=0.21",          # mock httpx
    "pytest-cov>=5.0",
]

[project.scripts]
acdyon = "acdyon.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
